<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>遼の脱出記録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<header class="topbar">
  <div><span class="eyebrow">INTERACTIVE ESCAPE ARCHIVE</span><h1>遼の脱出記録 <span>—</span></h1></div>
  <button id="soundToggle" class="ghost" aria-pressed="false">♪ 音: OFF</button>
</header>
<main class="layout">
  <section class="scene-panel">
    <div class="scene-art" id="sceneArt" aria-hidden="true"><div class="moon"></div><div class="window"></div><div class="desk"></div><div class="door-shape"></div><div class="dust"></div></div>
    <div class="scene-heading"><div><span class="eyebrow" id="chapterLabel">CHAPTER 01</span><h2 id="sceneTitle">目覚めの部屋</h2></div><span id="roomTag" class="tag">ROOM 01</span></div>
    <p id="sceneText" class="scene-text"></p>
    <div id="sceneNotice" class="notice" aria-live="polite">周囲を調べ、道具を集めてください。</div>
    <div class="actions" id="actions"></div>
  </section>
  <aside class="side-panel">
    <section class="panel-block"><h3>持ち物 <span id="itemCount">0</span></h3><div id="inventory" class="inventory"><p class="muted">まだ何も持っていない。</p></div></section>
    <section class="panel-block"><h3>記録メモ</h3><ul id="journal" class="journal"><li>目が覚めた。ここがどこかも分からない。</li></ul></section>
    <section class="panel-block"><h3>進行状況</h3><div class="progress-track"><div id="progressBar"></div></div><p id="progressText" class="muted">探索 0%</p><div class="mini-actions"><button id="saveBtn" class="ghost">セーブ</button><button id="loadBtn" class="ghost">ロード</button><button id="resetBtn" class="danger ghost">最初から</button></div></section>
  </aside>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="modal-card"><button id="closeModal" class="modal-close" aria-label="閉じる">×</button><span class="eyebrow">INTERACTION</span><h2 id="modalTitle">調べる</h2><div id="modalBody"></div></div>
</div>
<footer>架空の人物・出来事を題材にしたファンゲーム風のオリジナル作品です。進行状況はこのブラウザ内に保存できます。</footer>
<script src="game.js"></script>
</body></html>
